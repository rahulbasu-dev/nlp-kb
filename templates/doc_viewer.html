{% extends "base.html" %}

{% block title %}{{ title }} - NLP Classroom{% endblock %}

{% block content %}
<div class="container">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('documentation_hub') }}">Documentation</a></li>
            <li class="breadcrumb-item active">{{ title }}</li>
        </ol>
    </nav>
    
    <!-- Content -->
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">{{ title }}</h3>
                </div>
                <div class="card-body">
                    <div class="doc-content">
                        {{ content|safe }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .doc-content h1, .doc-content h2, .doc-content h3 {
        margin-top: 2rem;
        margin-bottom: 1rem;
    }
    
    .doc-content h1 { font-size: 2rem; border-bottom: 3px solid #0d6efd; padding-bottom: 0.5rem; }
    .doc-content h2 { font-size: 1.5rem; }
    .doc-content h3 { font-size: 1.25rem; }
    
    .doc-content code {
        background: #f5f5f5;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
    }
    
    .doc-content pre {
        background: #2d2d2d;
        color: #f8f8f2;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
    }
    
    .doc-content pre code {
        background: none;
        color: inherit;
        padding: 0;
    }
    
    .doc-content ul, .doc-content ol {
        margin-bottom: 1rem;
    }
    
    .doc-content li {
        margin-bottom: 0.5rem;
    }
    
    .doc-content a {
        color: #0d6efd;
        text-decoration: none;
    }
    
    .doc-content a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
